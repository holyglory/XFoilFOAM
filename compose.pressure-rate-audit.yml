services:
  pressure:
    image: sha256:2179169c965cc566946fcb5b449226182424c7d58323b027719ec96e777ca457
    network_mode: none
    environment:
      AIRFOILFOAM_EVIDENCE_BUCKET: ""
      AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./scripts/materials:/verification:ro
      - ./tests/fixtures/rae2822:/reference:ro
      - ./tests/fixtures/air-thermophysics-audit.json:/material.json:ro
      - /mnt/build-storage/codex/xfoilfoam-verification/pressure-native-reference-20260911-result:/continuation:ro
      - rate-evidence:/evidence
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/reference", "--material", "/material.json", "--destination", "/evidence/pressure-rate-audit", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--processes", "4", "--local-time-pressure", "--pressure-advection", "vanLeer", "--native-steady-check", "--resume-local-pressure", "/continuation", "--resume-to-iteration", "3200", "--snapshot-audit"]
  artifacts:
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    network_mode: bridge
    command: ["python", "-m", "http.server", "8080", "--directory", "/evidence"]
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - rate-evidence:/evidence:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=2).read(1)"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  rate-evidence:
