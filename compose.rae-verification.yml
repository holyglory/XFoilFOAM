x-verification: &verification
  image: xfoilfoam-local-steady:verification
  pull_policy: never
  network_mode: none
  environment:
    AIRFOILFOAM_EVIDENCE_BUCKET: ""
    AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ./scripts/materials/rae2822_reference.py:/verification/rae2822_reference.py:ro
    - ./scripts/materials/verify_rae2822.py:/verification/verify_rae2822.py:ro
    - ./scripts/materials/solver_stability.py:/verification/solver_stability.py:ro
    - ./scripts/materials/rae2822_grid.py:/verification/rae2822_grid.py:ro
    - ./tests/fixtures/rae2822:/verification/reference:ro
    - ./tests/fixtures/air-thermophysics-audit.json:/verification/material.json:ro
    - rae-evidence:/evidence

services:
  nasa-grid-check:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    volumes:
      - ./scripts/materials:/verification:ro
      - ./tests/fixtures/rae2822:/reference:ro
      - ./tests/fixtures/air-thermophysics-audit.json:/material.json:ro
      - /mnt/build-storage/codex/xfoilfoam-verification/rae2822-nasa-grid-source-20260910/raetaf.x.fmt:/source/raetaf.x.fmt:ro
      - rae-evidence:/evidence
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/reference", "--material", "/material.json", "--destination", "/evidence/nasa-grid-check", "--tier", "precise", "--uniform-start", "--enthalpy", "--first-order", "--reference-grid", "/source/raetaf.x.fmt", "--mesh-only"]
  fast:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/fast", "--tier", "fast"]
  precise:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/precise", "--tier", "precise"]
  refined:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/refined", "--tier", "refined"]
  transonic:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/transonic", "--tier", "precise", "--transonic"]
  wall-function:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/wall-function", "--tier", "fast", "--wall-functions"]
  uniform-start:
    <<: *verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/uniform-start", "--tier", "fast", "--wall-functions", "--uniform-start"]
  guarded-start:
    <<: *verification
    image: xfoilfoam-progressive-worker:local
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/guarded-start", "--tier", "fast", "--wall-functions"]
  enthalpy:
    <<: *verification
    image: xfoilfoam-enthalpy:verification
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy", "--tier", "fast", "--wall-functions", "--uniform-start", "--enthalpy"]
  enthalpy-precise:
    <<: *verification
    image: xfoilfoam-enthalpy:verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-precise", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy"]
  enthalpy-transonic:
    <<: *verification
    image: xfoilfoam-enthalpy:verification
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-transonic", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--transonic"]
  enthalpy-upwind:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-upwind", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order"]
  enthalpy-upwind-refined:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-upwind-refined", "--tier", "refined", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order", "--time-budget-seconds", "3000"]
  enthalpy-upwind-limited:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-upwind-limited", "--tier", "refined", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order", "--time-budget-seconds", "3000", "--limited-nonorthogonal"]
  enthalpy-upwind-transonic-refined:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-upwind-transonic-refined", "--tier", "refined", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order", "--transonic", "--pressure-equation-relaxation", "1", "--time-budget-seconds", "3000"]
  enthalpy-upwind-mpi:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-upwind-mpi", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order", "--processes", "4"]
  enthalpy-consistent-refined:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-consistent-refined", "--tier", "refined", "--wall-functions", "--uniform-start", "--enthalpy", "--first-order", "--transonic", "--pressure-equation-relaxation", "1", "--time-budget-seconds", "3000", "--consistent-pressure"]
  enthalpy-refine:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-refine", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--donor", "${RAE_DONOR_CASE:-/evidence/unavailable-donor}"]
  enthalpy-mixed-energy:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-mixed-energy", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--donor", "${RAE_DONOR_CASE:-/evidence/unavailable-donor}", "--upwind-energy"]
  enthalpy-transonic-krylov:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-transonic-krylov", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--transonic", "--pressure-krylov"]
  enthalpy-transonic-relaxed:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-transonic-relaxed", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--transonic", "--pressure-equation-relaxation"]
  enthalpy-transonic-damped:
    <<: *verification
    image: sha256:51d139532e97d49947f2d03210d1bf924fa8558982bdd1b28081f8c742602f25
    command: ["python", "/verification/verify_rae2822.py", "--reference", "/verification/reference", "--material", "/verification/material.json", "--destination", "/evidence/enthalpy-transonic-damped", "--tier", "precise", "--wall-functions", "--uniform-start", "--enthalpy", "--transonic", "--pressure-equation-relaxation", "0.3"]
  artifacts:
    image: xfoilfoam-local-steady:verification
    pull_policy: never
    network_mode: bridge
    command: ["python", "-m", "http.server", "8080", "--directory", "/evidence"]
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - rae-evidence:/evidence:ro

volumes:
  rae-evidence:
