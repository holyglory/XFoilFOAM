x-engine: &engine
  image: sha256:8a45eeefa364606aac98804e1f9aa48bd051830ff8731e15a7750f0754e48d09
  pull_policy: never
  network_mode: service:redis
  entrypoint:
    - /bin/sh
    - -ec
    - |
      export AIRFOILFOAM_ENGINE_APPLICATION_SOURCE_SHA256="$$(python -c 'from pathlib import Path; from airfoilfoam.provenance import application_source_sha256; print(application_source_sha256(Path("/candidate")))')"
      export AIRFOILFOAM_ENGINE_SOURCE_REVISION=""
      export AIRFOILFOAM_BUILD_ID="isolated-local-step-worker-contract"
      export AIRFOILFOAM_ENGINE_PACKAGE_SHA256="$$(cat /etc/airfoilfoam-engine-package-sha256)"
      export AIRFOILFOAM_ENGINE_BINARY_SHA256="$$(cat /etc/airfoilfoam-engine-binary-sha256)"
      exec "$$@"
    - source-overlay
  environment: &environment
    PYTHONPATH: /candidate/src
    PYTHONDONTWRITEBYTECODE: "1"
    AIRFOILFOAM_REDIS_URL: redis://127.0.0.1:6379/0
    AIRFOILFOAM_DATA_DIR: /data/airfoilfoam
    AIRFOILFOAM_CACHE_DIR: /data/cache
    AIRFOILFOAM_OPENFOAM_RUNNER: local
    AIRFOILFOAM_EVIDENCE_BUCKET: ""
    AIRFOILFOAM_CONTROL_PLANE_TOKEN: isolated-control-rpc-test-token-not-a-production-secret
    AIRFOILFOAM_WORKER_CPU_BUDGET: "1"
    AIRFOILFOAM_CELERY_CONCURRENCY: "1"
    AIRFOILFOAM_CASE_CONCURRENCY: "1"
  volumes:
    - ./src:/candidate/src:ro
    - ./pyproject.toml:/candidate/pyproject.toml:ro
    - type: volume
      source: control-data
      target: /data
      volume:
        nocopy: true
  depends_on:
    redis:
      condition: service_healthy
  ulimits:
    nofile:
      soft: 65536
      hard: 524288

services:
  redis:
    image: redis:7-alpine
    network_mode: none
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  gateway:
    <<: *engine
    command: ["uvicorn", "airfoilfoam.api.main:app", "--host", "127.0.0.1", "--port", "8000"]
  worker:
    <<: *engine
    command: ["celery", "-A", "airfoilfoam.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "openfoam-opencfd-2606"]
  verify:
    <<: *engine
    command: ["python", "/verification/verify_control_pool_native.py"]
    volumes:
      - ./src:/candidate/src:ro
      - ./pyproject.toml:/candidate/pyproject.toml:ro
      - ./scripts/dev/verify_control_pool_native.py:/verification/verify_control_pool_native.py:ro
      - ./packages/db/seed/selig-database/ag24.dat:/fixture/ag24.dat:ro
      - type: bind
        source: ./.codex-artifacts/control-rpc-native
        target: /verification-output
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
      worker:
        condition: service_started

volumes:
  control-data:
