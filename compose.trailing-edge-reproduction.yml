x-experiment: &experiment
  image: sha256:d0a5fd5f9723be5c92d7713df3d12b89675045477d6dbed8924f5e598e51ab46
  pull_policy: never
  network_mode: none
  environment:
    PYTHONPATH: /candidate/src
    PYTHONDONTWRITEBYTECODE: "1"
    AIRFOILFOAM_EVIDENCE_BUCKET: ""
    AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
    AIRFOILFOAM_OPENFOAM_RUNNER: local
    AIRFOILFOAM_ENGINE_NUMERICS_REVISION: "2"
    AIRFOILFOAM_CELERY_QUEUE: openfoam-opencfd-2606-numerics-2
    AIRFOILFOAM_ENABLED_ENGINE_KEYS: openfoam:opencfd:2606:numerics-2:adapter-1
    AIRFOILFOAM_WORKER_CPU_BUDGET: "1"
    OMP_NUM_THREADS: "1"
  volumes:
    - ./src:/candidate/src:ro
    - ./pyproject.toml:/candidate/pyproject.toml:ro
    - ./scripts/materials/reproduce_blunt_trailing_edge.py:/verification/reproduce.py:ro
    - ./.codex-artifacts/sg6051-polar-diagnosis-20260930/job-request.json:/fixture/request.json:ro
    - trailing-edge-evidence:/evidence
  ulimits:
    nofile:
      soft: 65536
      hard: 524288

services:
  fixed:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "production-fixed"]
  numerics2:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "production-fixed", "--verify-numerical-transition"]
  full-polar:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "production-fixed", "--verify-numerical-transition", "--full-polar-reference"]
  legacy:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "legacy"]
  pinched:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "pinched-cartesian"]
  source:
    <<: *experiment
    command: ["python", "/verification/reproduce.py", "--request", "/fixture/request.json", "--destination", "/evidence", "--variant", "source-cartesian"]
  artifacts:
    image: sha256:d0a5fd5f9723be5c92d7713df3d12b89675045477d6dbed8924f5e598e51ab46
    pull_policy: never
    network_mode: bridge
    command: ["python", "-m", "http.server", "8080", "--directory", "/evidence"]
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - trailing-edge-evidence:/evidence:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=2).read(1)"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  trailing-edge-evidence:
