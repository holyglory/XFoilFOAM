x-canary: &canary
  image: xfoilfoam-progressive-worker:local
  pull_policy: never
  network_mode: none
  environment:
    PYTHONPATH: /candidate/src
    AIRFOILFOAM_OPENFOAM_RUNNER: local
    AIRFOILFOAM_REDIS_URL: redis://127.0.0.1:1/0
    AIRFOILFOAM_DATA_DIR: /canary-output/data
    AIRFOILFOAM_CACHE_DIR: /canary-output/cache
    AIRFOILFOAM_EVIDENCE_BUCKET: ""
    AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
  ulimits:
    nofile:
      soft: 65536
      hard: 524288
  volumes:
    - ./src:/candidate/src:ro
    - ./packages/db/seed/selig-database/ag24.dat:/canary/ag24.dat:ro
    - numerical-results:/canary-output

services:
  artifacts:
    image: xfoilfoam-progressive-worker:local
    pull_policy: never
    network_mode: bridge
    command: ["python", "-m", "http.server", "8080", "--directory", "/canary-output"]
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - numerical-results:/canary-output:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=2).read(1)"]
      interval: 1s
      timeout: 3s
      retries: 60
  subsonic:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoSimpleFoam", "--mach", "0.72", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/subsonic"]
  transonic:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoPimpleFoam", "--mach", "0.9", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/transonic"]
  mach2:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "2", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach2"]
  mach3:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3"]
  mach3-small-step:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-small-step", "--maximum-courant", "0.05", "--save-every-step"]
  mach3-first-order:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-first-order", "--momentum-scheme", "upwind", "--save-every-step"]
  mach3-limited-correction:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-limited-correction", "--limited-nonorthogonal", "--save-every-step"]
  mach3-startup-handoff:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-startup-handoff", "--first-order-startup"]
  mach3-finite-edge:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-edge", "--finite-edge-mesh", "--save-every-step"]
  mach3-tadmor:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-tadmor", "--tadmor-flux", "--save-every-step"]
  mach3-minmod:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-minmod", "--minmod-reconstruction", "--save-every-step"]
  mach3-finite-minmod:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-minmod", "--finite-edge-mesh", "--minmod-reconstruction", "--save-every-step"]

volumes:
  numerical-results:
