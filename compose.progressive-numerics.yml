x-canary: &canary
  image: xfoilfoam-progressive-worker:local
  pull_policy: never
  network_mode: none
  environment:
    PYTHONPATH: /candidate/src
    AIRFOILFOAM_OPENFOAM_RUNNER: local
    AIRFOILFOAM_REDIS_URL: redis://127.0.0.1:1/0
    AIRFOILFOAM_DATA_DIR: /canary-output/data
    AIRFOILFOAM_CACHE_DIR: /canary-output/cache
    AIRFOILFOAM_EVIDENCE_BUCKET: ""
    AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
  ulimits:
    nofile:
      soft: 65536
      hard: 524288
  volumes:
    - ./src:/candidate/src:ro
    - ./packages/db/seed/selig-database/ag24.dat:/canary/ag24.dat:ro
    - numerical-results:/canary-output

services:
  mach3-production: &production-replay
    <<: *canary
    environment:
      PYTHONPATH: /candidate/src:/candidate
      PYTHONDONTWRITEBYTECODE: "1"
      AIRFOILFOAM_OPENFOAM_RUNNER: local
      AIRFOILFOAM_EVIDENCE_BUCKET: ""
      AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
    volumes:
      - ./src:/candidate/src:ro
      - ./pyproject.toml:/candidate/pyproject.toml:ro
      - ./scripts/materials:/candidate/scripts/materials:ro
      - ./.codex-artifacts/mach3-production-replay-20260930/ag24-request.json:/fixture/request.json:ro
      - numerical-results:/canary-output
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-production"]
  mach3-anchor:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-anchor", "--anchor-zero"]
  mach3-quiescent:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-quiescent", "--quiescent-start"]
  mach3-finite-production:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-finite-production", "--finite-edge-mesh"]
  mach3-production-fields:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-production-fields", "--early-fields"]
  mach3-production-fixed:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-production-fixed"]
  mach3-startup-tenth:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-startup-tenth", "--startup-courant", "0.1", "--early-fields"]
  mach3-startup-twentieth:
    <<: *production-replay
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "cea9c7f3190b6246c782ce889b9d57e7b42e9d099202fa01a084a3ddcac2c420", "--destination", "/canary-output/mach3-startup-twentieth", "--startup-courant", "0.05", "--early-fields"]
  energy-probe-build:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: thermophysics-build
    network_mode: none
    entrypoint: ["bash", "-lc"]
    command:
      - >-
        source /usr/lib/openfoam/openfoam2606/etc/bashrc >/dev/null 2>&1 || exit 1;
        set -e;
        export FOAM_USER_APPBIN=/canary-output/energy-probe-build-r1/bin;
        mkdir -p "$$FOAM_USER_APPBIN";
        python3 /diagnostic/build_energy_probe.py
        --source /usr/lib/openfoam/openfoam2606/applications/solvers/compressible/rhoCentralFoam
        --header /diagnostic/energyDiagnostic.H
        --destination /canary-output/energy-probe-build-r1/source
    volumes:
      - ./scripts/materials/build_energy_probe.py:/diagnostic/build_energy_probe.py:ro
      - ./src/airfoilfoam/native/energy-probe/energyDiagnostic.H:/diagnostic/energyDiagnostic.H:ro
      - numerical-results:/canary-output
  mach3-energy:
    <<: *canary
    depends_on:
      energy-probe-build:
        condition: service_completed_successfully
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-energy", "--energy-probe", "/canary-output/energy-probe-build-r1/bin/xfoilfoamEnergyProbe", "--save-every-step"]
  mach3-finite-energy:
    <<: *canary
    depends_on:
      energy-probe-build:
        condition: service_completed_successfully
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-energy", "--finite-edge-mesh", "--energy-probe", "/canary-output/energy-probe-build-r1/bin/xfoilfoamEnergyProbe", "--save-every-step"]
  mach3-pressure:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoPimpleFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-pressure", "--density-farfield", "--save-every-step"]
  mach3-finite-pressure:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoPimpleFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-pressure", "--finite-edge-mesh", "--density-farfield", "--save-every-step"]
  artifacts:
    image: xfoilfoam-progressive-worker:local
    pull_policy: never
    network_mode: bridge
    command: ["python", "-m", "http.server", "8080", "--directory", "/canary-output"]
    ports:
      - "127.0.0.1:${PORT}:8080"
    volumes:
      - numerical-results:/canary-output:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=2).read(1)"]
      interval: 1s
      timeout: 3s
      retries: 60
  subsonic:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoSimpleFoam", "--mach", "0.72", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/subsonic"]
  transonic:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoPimpleFoam", "--mach", "0.9", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/transonic"]
  mach2:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "2", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach2"]
  mach3:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3"]
  mach3-small-step:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-small-step", "--maximum-courant", "0.05", "--save-every-step"]
  mach3-first-order:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-first-order", "--momentum-scheme", "upwind", "--save-every-step"]
  mach3-limited-correction:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-limited-correction", "--limited-nonorthogonal", "--save-every-step"]
  mach3-startup-handoff:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-startup-handoff", "--first-order-startup"]
  mach3-finite-edge:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-edge", "--finite-edge-mesh", "--save-every-step"]
  mach3-tadmor:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-tadmor", "--tadmor-flux", "--save-every-step"]
  mach3-minmod:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-minmod", "--minmod-reconstruction", "--save-every-step"]
  mach3-finite-minmod:
    <<: *canary
    command: ["python", "-m", "airfoilfoam.numerical_canary", "--family", "rhoCentralFoam", "--mach", "3", "--coordinates", "/canary/ag24.dat", "--case-dir", "/canary-output/mach3-finite-minmod", "--finite-edge-mesh", "--minmod-reconstruction", "--save-every-step"]

volumes:
  numerical-results:
