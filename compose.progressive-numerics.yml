    volumes:
      - ./src:/candidate/src:ro
      - ./pyproject.toml:/candidate/pyproject.toml:ro
      - ./scripts/materials:/candidate/scripts/materials:ro
      - ./.codex-artifacts/mach3-production-replay-20260930/ag24-precise-request.json:/fixture/request.json:ro
      - numerical-results:/canary-output
    command: ["python", "-m", "scripts.materials.replay_production_numerics", "--request", "/fixture/request.json", "--sha256", "04e24159cd6d79db3955a9a5f385e3e7159b4408c2d16d99e38b2a9c542953ed", "--destination", "/canary-output/mach3-precise-cold", "--precise-startup"]
