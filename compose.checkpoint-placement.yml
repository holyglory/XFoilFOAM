services:
  paired:
    image: opencfd/openfoam-run:2606@sha256:4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb
    pull_policy: never
    network_mode: none
    cpus: 3
    user: "1000:1003"
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      DC2_DEPLOYMENT: "${DC2_DEPLOYMENT}"
      DC2_COMPONENT: "${DC2_COMPONENT}"
      DC2_GENERATION: "${DC2_GENERATION}"
    volumes:
      - ./.codex-artifacts/checkpoint-placement/input:/input:ro
      - ./.codex-artifacts/checkpoint-placement/output:/output
      - ./.codex-artifacts/checkpoint-placement/python:/python:ro
      - ./scripts/materials/checkpoint_placement.py:/driver/checkpoint_placement.py:ro
    entrypoint: ["bash", "-lc"]
    command:
      - source /usr/lib/openfoam/openfoam2606/etc/bashrc && exec /python/bin/python3.12 /driver/checkpoint_placement.py native --input /input --output /output
