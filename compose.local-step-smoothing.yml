services:
  baseline: &baseline
    image: sha256:8a45eeefa364606aac98804e1f9aa48bd051830ff8731e15a7750f0754e48d09
    pull_policy: never
    network_mode: none
    environment:
      PYTHONPATH: /candidate/src
      PYTHONDONTWRITEBYTECODE: "1"
      AIRFOILFOAM_EVIDENCE_BUCKET: ""
      AIRFOILFOAM_CONTROL_PLANE_TOKEN: ""
      AIRFOILFOAM_OPENFOAM_RUNNER: local
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/baseline", "--start", "cold"]
    volumes:
      - ./src:/candidate/src:ro
      - ./pyproject.toml:/candidate/pyproject.toml:ro
      - ./scripts/materials/reproduce_mach3_failure.py:/verification/reproduce_mach3_failure.py:ro
      - ./packages/db/seed/selig-database/fx60100.dat:/fixture/fx60100.dat:ro
      - ./tests/fixtures/air-thermophysics-audit.json:/fixture/air.json:ro
      - type: bind
        source: ./.codex-artifacts/local-step-smoothing
        target: /evidence
        bind:
          create_host_path: false
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
  cold:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/cold", "--start", "cold", "--smoothing", "0.2"]
  marched:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/marched", "--start", "marched", "--smoothing", "0.2"]
  parallel:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/parallel", "--start", "marched", "--smoothing", "0.2", "--processes", "2"]
  mach12-baseline:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/mach12-baseline", "--mach", "1.2"]
  mach12-candidate:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/mach12-candidate", "--mach", "1.2", "--smoothing", "0.2"]
  mach2-baseline:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/mach2-baseline", "--mach", "2"]
  mach2-candidate:
    <<: *baseline
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/mach2-candidate", "--mach", "2", "--smoothing", "0.2"]
