services:
  parallel:
    extends:
      file: compose.mach3-failure.yml
      service: cold
    environment:
      AIRFOILFOAM_WORKER_CPU_BUDGET: "2"
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/parallel", "--start", "cold", "--processes", "2", "--iterations", "100"]
  marched:
    extends:
      file: compose.mach3-failure.yml
      service: cold
    command: ["python", "/verification/reproduce_mach3_failure.py", "--coordinates", "/fixture/fx60100.dat", "--material", "/fixture/air.json", "--destination", "/evidence/marched", "--start", "marched"]
