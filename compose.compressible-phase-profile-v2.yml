services:
  profile:
    build:
      context: .
      dockerfile: docker/Dockerfile.compressible-phase-profile
    network_mode: none
    cpus: 5
    user: "1000:1003"
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      DC2_DEPLOYMENT: "${DC2_DEPLOYMENT}"
      DC2_COMPONENT: "${DC2_COMPONENT}"
      DC2_GENERATION: "${DC2_GENERATION}"
    volumes:
      - ./.codex-artifacts/compressible-phase-profile-v2/input:/input:ro
      - ./.codex-artifacts/compressible-phase-profile-v2/output:/output
      - ./.codex-artifacts/compressible-phase-profile-v2/python:/python:ro
      - ./.codex-artifacts/compressible-phase-profile-v2/input/library/libxfoilfoamThermophysics.so:/opt/xfoilfoam-thermophysics/lib/libxfoilfoamThermophysics.so:ro
      - ./scripts/materials/compressible_cost_profile.py:/driver/compressible_cost_profile.py:ro
      - ./scripts/materials/compressible_checkpoint_placement.py:/driver/compressible_checkpoint_placement.py:ro
      - ./scripts/materials/checkpoint_placement.py:/driver/checkpoint_placement.py:ro
      - ./scripts/materials/compressible_phase_profile.py:/driver/compressible_phase_profile.py:ro
    entrypoint: ["bash", "-lc"]
    command:
      - source /usr/lib/openfoam/openfoam2606/etc/bashrc && exec /python/bin/python3.12 /driver/compressible_phase_profile.py native --input /input --output /output
